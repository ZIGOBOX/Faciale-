<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>ZiGoBox Facial</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>ZiGoBox</h1><p>Reconnaissance faciale → roue</p></div><div id="status" class="pill warn">Chargement IA…</div></header>
<main>
<section class="card"><h2>1. Caméra</h2><div class="camera"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="faceBadge" class="face-badge">Aucun visage</div></div>
<div class="buttons"><button id="cameraBtn">Activer la caméra</button><button id="saveBtn" class="secondary" disabled>Enregistrer ce visage</button><button id="deleteBtn" class="danger">Effacer le visage</button></div>
<div class="stats"><div><b>Détection</b><span id="detected">Non</span></div><div><b>Enregistré</b><span id="saved">Non</span></div><div><b>Reconnu</b><span id="recognized">Non</span></div><div><b>Similarité</b><span id="similarity">—</span></div></div><p id="help" class="help">Active la caméra, puis regarde-la bien de face.</p></section>
<section class="card center"><h2>2. Roue</h2><div class="wheel-wrap"><div class="pointer">▼</div><canvas id="wheel" width="600" height="600"></canvas></div>
<div class="buttons center-buttons"><button id="spinBtn">Lancer la roue</button><button id="editBtn" class="secondary">Modifier les lots</button></div><div id="winner" class="winner">En attente…</div></section>
<section class="card full"><h2>3. Réglages</h2><label>Seuil de reconnaissance : <strong id="thresholdLabel">0.55</strong><input id="threshold" type="range" min="0.40" max="0.80" step="0.01" value="0.55"></label>
<label>Délai entre deux déclenchements<select id="cooldown"><option value="5000">5 secondes</option><option value="10000" selected>10 secondes</option><option value="20000">20 secondes</option><option value="30000">30 secondes</option></select></label>
<label class="check"><input id="autoSpin" type="checkbox" checked> Lancer automatiquement la roue si le visage est reconnu</label></section></main>
<dialog id="dialog"><h3>Lots de la roue</h3><textarea id="prizesInput" rows="10"></textarea><div class="buttons"><button id="cancelEdit" class="secondary">Annuler</button><button id="saveEdit">Enregistrer</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script><script src="app.js"></script></body></html>
